project:
  type: manuscript
  output-dir: _manuscript
  render:
    - "*.qmd"
    - "!legacy/"
    - "!log/"

manuscript:
  article: index.qmd
  notebooks:
    - notebook: notebooks/c01_view_from_space.ipynb
      title: "N1: View from outer space"
    - notebook: notebooks/c02_regional_convergence_sc.ipynb
      title: "N2: Regional convergence"
    - notebook: notebooks/c03_spatial_dependence_lisa.ipynb
      title: "N3: Spatial dependence"
    - notebook: notebooks/c04_spillover_modeling_6nn.ipynb
      title: "N4: Spillover modeling"
    - notebook: notebooks/c07_alternative_w_matrices.ipynb
      title: "N5: Robustness — alternative spatial weights"
    - notebook: notebooks/c06_spatial_culture.ipynb
      title: "N6: Spatial culture"

format:
  # REGION journal PDF (uses extension template)
  region-ersa/REGION-pdf:
    keep-tex: true
    docstatus: final  # Options: review, final, uncorrected
    output-file: index-REGION
    notebook-links: false
    # Production build (accepted 2026-09-19). `docstatus` is emitted as a global
    # class option, so region.sty sees `final`: isfinal stays true and isreview
    # is never set. That drops \linenumbers and the "for review only" banner,
    # restores the byline and the running head, and turns on the citation line,
    # the DOI and the Received/Accepted dates.
    #
    # partials/title.tex emits an unconditional \setcounter{page}{999} in the
    # preamble -- the journal's own page-range placeholder, which is why the
    # review PDF was numbered 999-1024. The hook below fires at \begin{document},
    # after the whole preamble and before \maketitle, so it wins and the
    # production PDF is numbered from 1. \AtBeginDocument is also required
    # because Quarto emits this include *before* \usepackage{region}.
    include-in-header:
      text: |
        \AtBeginDocument{\setcounter{page}{1}}

  # Main HTML format for GitHub Pages
  html:
    number-sections: true

    # Table of Contents
    toc: true
    toc-depth: 3
    toc-location: left
    toc-title: "Contents"

    # Theme and Appearance
    theme:
      light: cosmo
      dark: darkly

    # Code Display
    code-fold: false
    code-tools: true
    code-copy: true

    # Interactive Features
    lightbox: true

    # Navigation
    anchor-sections: true
    smooth-scroll: true

    # Citations and References
    citation-location: document

    # Comments (keep existing)
    comments:
      hypothesis: false

    # Format Links
    format-links: true

  docx:
    number-sections: true
    notebook-links: false

  # Standard PDF (distinct from REGION format)
  pdf:
    header-includes:
      - '\providecommand{\keywords}[1]{\par\vspace{3mm}\noindent\textbf{Key words: }#1\par\vspace{3mm}}'
      - '\providecommand{\jel}[1]{\par\vspace{3mm}\noindent\textbf{JEL classification: }#1\par\vspace{3mm}}'
    documentclass: scrartcl
    papersize: letter
    number-sections: true
    colorlinks: true
    keep-tex: true  # For debugging/comparison
    output-file: index
    notebook-links: false

execute:
  freeze: auto

editor: source

